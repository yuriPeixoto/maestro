# Local development only. NOT used in production deployment.
# Production runs on a bare-metal server via systemd — see docs/deployment.md.
#
# Usage:
#   docker compose up                  # core stack (postgres, redis, nats, clickhouse, api, worker, ingest, frontend)
#   docker compose up -d postgres      # just Postgres, for the API tests (see api/tests/conftest.py)
#   docker compose up -d nats-streams  # just NATS with its streams (docs/nats.md)
#   docker compose --profile demo up   # core stack + demo data seeder
#
# Redis, NATS and ClickHouse are published on non-default host ports so the stack can run
# next to an existing local Redis/ClickHouse. Override them with the *_HOST_PORT
# variables (shell or a .env file next to this file). Inside the compose network the
# services keep their default ports (redis:6379, clickhouse:8123).

services:

  redis:
    image: redis:8.2-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Transport (ADR-015). Same accounts, permissions, streams and consumers as production, without TLS.
  # nats-keys generates fresh NKeys once into the nats-dev volume (admin, maestro-worker,
  # maestro-api, dev-a, dev-b); nats-streams creates the streams and the ingest consumers.
  # Permission check (dev-a against dev-b and back, then Maestro's own users):
  #   docker compose run --rm nats-check
  nats-keys:
    image: natsio/nats-box:0.20.2
    command: ["sh", "/scripts/keys.sh"]
    volumes:
      - ./scripts/nats-dev:/scripts:ro
      - ./deploy/nats:/deploy/nats:ro
      - nats-dev:/nats-dev

  nats:
    image: nats:2.15.3-alpine   # same release as the production install
    command: ["--config", "/etc/nats/nats-dev.conf"]
    ports:
      - "${NATS_HOST_PORT:-14222}:4222"
      - "${NATS_MONITOR_HOST_PORT:-18222}:8222"
    volumes:
      - ./scripts/nats-dev/nats-dev.conf:/etc/nats/nats-dev.conf:ro
      - nats-dev:/etc/nats/dev:ro
      - nats-data:/data
    depends_on:
      nats-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats-streams:
    image: natsio/nats-box:0.20.2
    command: ["sh", "/deploy/nats/create-streams.sh"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_NKEY: /nats-dev/admin.nk
    volumes:
      - ./deploy/nats:/deploy/nats:ro
      - nats-dev:/nats-dev:ro
    depends_on:
      nats:
        condition: service_healthy

  nats-check:
    profiles: ["check"]
    image: natsio/nats-box:0.20.2
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sh /deploy/nats/check-permissions.sh dev-a /nats-dev/dev-a.nk dev-b &&
        sh /deploy/nats/check-permissions.sh dev-b /nats-dev/dev-b.nk dev-a &&
        sh /deploy/nats/check-maestro-users.sh /nats-dev/maestro-worker.nk /nats-dev/maestro-api.nk
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./deploy/nats:/deploy/nats:ro
      - nats-dev:/nats-dev:ro
    depends_on:
      nats-streams:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine   # same major as the production database
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro-local-only
      POSTGRES_DB: maestro
    volumes:
      # Creates maestro_test too, for the API tests (MAESTRO_TEST_DATABASE_URL).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maestro", "-d", "maestro"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the Alembic migrations, then exits; api and worker wait for it.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      MAESTRO_DATABASE_URL: postgresql://maestro:maestro-local-only@postgres:5432/maestro
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app

  clickhouse:
    image: clickhouse/clickhouse-server:25.5   # same line as the production install the migrations are tested on
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-18123}:8123"   # HTTP interface
      - "${CLICKHOUSE_TCP_HOST_PORT:-19100}:9000"    # native TCP (DataGrip, clickhouse-client)
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      # Migrations are auto-executed on first startup in alphabetical order.
      - ./migrations:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment: &api-environment
      MAESTRO_REDIS_URL: redis://redis:6379
      MAESTRO_CLICKHOUSE_HOST: clickhouse
      MAESTRO_CLICKHOUSE_PORT: 8123
      # Docker uses the default user — no maestro_app setup needed for local dev.
      MAESTRO_CLICKHOUSE_USER: default
      MAESTRO_CLICKHOUSE_PASSWORD: ""
      MAESTRO_CLICKHOUSE_DATABASE: maestro
      MAESTRO_JWT_SECRET: local-development-only-0000000000000000
      MAESTRO_ADMIN_PASSWORD_HASH: ""
      MAESTRO_DATABASE_URL: postgresql://maestro:maestro-local-only@postgres:5432/maestro
      # Agents may publish to Redis, NATS or both (docs/nats.md); development reads both.
      MAESTRO_TRANSPORT: both
      MAESTRO_NATS_URL: nats://nats:4222
      MAESTRO_NATS_WORKER_NKEY_FILE: /nats-dev/maestro-worker.nk
      MAESTRO_NATS_API_NKEY_FILE: /nats-dev/maestro-api.nk
    depends_on: &api-depends-on
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats-streams:
        condition: service_completed_successfully
    volumes: &api-volumes
      - ./api:/app   # live reload via --reload in CMD
      - nats-dev:/nats-dev:ro

  # Stream consumers, alert evaluator and scheduled jobs. One instance only.
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *api-environment
    depends_on: *api-depends-on
    volumes: *api-volumes

  # NATS consumers (ADR-015): metrics and logs into ClickHouse, agent events into Postgres.
  ingest:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.ingest"]
    environment: *api-environment
    depends_on: *api-depends-on
    volumes: *api-volumes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src   # live reload

  seeder:
    profiles: ["demo"]
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "seeder.py"]
    environment:
      MAESTRO_REDIS_URL: redis://redis:6379
      MAESTRO_CLICKHOUSE_HOST: clickhouse
      MAESTRO_CLICKHOUSE_PORT: 8123
      MAESTRO_CLICKHOUSE_USER: default
      MAESTRO_CLICKHOUSE_PASSWORD: ""
      MAESTRO_CLICKHOUSE_DATABASE: maestro
    depends_on:
      api:
        condition: service_started

volumes:
  clickhouse-data:
  postgres-data:
  nats-data:
  nats-dev:
