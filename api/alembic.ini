# Alembic: the Postgres schema (ADR-011). The URL comes from MAESTRO_DATABASE_URL (alembic/env.py).
#
#   uv run alembic upgrade head          # apply to the database in MAESTRO_DATABASE_URL
#   uv run alembic upgrade head --sql    # print the SQL instead, to run by hand

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
