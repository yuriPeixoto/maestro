# NATS for local development only (docker compose). Production: deploy/nats/nats-server.conf.example.
# Same accounts, permissions and streams as production, without TLS. The users file is generated on
# first start by keys.sh, with fresh keys, into the nats-dev volume.

server_name: maestro-nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB
authorization { timeout: 2 }

jetstream {
  store_dir: "/data"
  max_file_store: 10G
  max_memory_store: 256M
}

# nats-server resolves includes next to this file: the nats-dev volume is mounted at /etc/nats/dev.
include dev/users.conf
