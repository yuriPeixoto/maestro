name: CI

# Verificação em todo PR e na main, nos runners do GitHub (gratuitos para repositório público).
# Independente do deploy.yml (self-hosted), que fica desativado enquanto não houver servidor.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o /dev/null ./cmd/agent
      - name: go test
        run: go test ./...

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"   # mesma versão do deploy
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        # Não bloqueia por enquanto: há 20 erros antigos (react-hooks e no-explicit-any)
        # a corrigir num PR próprio. Depois de zerar, remova o continue-on-error.
        continue-on-error: true
        run: npm run lint
