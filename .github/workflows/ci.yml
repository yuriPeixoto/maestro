name: CI

# Verificação em todo PR e na main, nos runners do GitHub (gratuitos para repositório público).
# Independente do deploy.yml (self-hosted), que fica desativado enquanto não houver servidor.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: |
          go build -o /dev/null ./cmd/agent
          go build -o /dev/null ./cmd/watchdog
      - name: go test
        run: go test ./...

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine   # same major as the production database
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro-ci-only
          POSTGRES_DB: maestro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro -d maestro_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MAESTRO_TEST_DATABASE_URL: postgresql://maestro:maestro-ci-only@localhost:5432/maestro_test
      # Postgres tests fail here instead of being skipped.
      MAESTRO_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3; no moving major tag upstream
        with:
          python-version: "3.14"   # mesma versão do deploy
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Instalar dependências (lock)
        run: uv sync --locked
      - name: pytest
        run: uv run --locked python -m pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
